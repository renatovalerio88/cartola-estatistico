name: Cartola Estatístico

on:

  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:

  atualizar:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Atualizar pip
        run: |
          python -m pip install --upgrade pip

      - name: Coletar API
        run: |
          python scripts/coletar_cartola.py

      - name: Importar Histórico
        run: |
          python scripts/importar_historico.py

      - name: Consolidar Base
        run: |
          python scripts/processamento/consolidar_base.py

      - name: Gerar Backtest
        run: |
          python scripts/processamento/gerar_backtest.py

      - name: Otimizar Pesos
        run: |
          python scripts/processamento/otimizar_pesos.py

      - name: Commit
        run: |

          git config user.name github-actions
          git config user.email github-actions@github.com

          git add .

          git diff --cached --quiet || (

            git commit -m "Atualização automática"

            git push

          )
