name: Cartola Estatístico

on:
  workflow_dispatch:

  schedule:
    # Executa diariamente às 06:00
    - cron: "0 6 * * *"

  push:
    branches:
      - main
    paths:
      - ".github/workflows/coletar-cartola.yml"

permissions:
  contents: write

concurrency:
  group: cartola-estatistico-coleta
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Atualizar pip e dependências V2
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install numpy scikit-learn

      # =====================================
      # HISTÓRICO PRIMEIRO
      # =====================================
      # O coletor histórico reconstitui rodada-XX/jogadores.json.
      # Por isso ele precisa terminar ANTES da coleta da rodada atual.
      # Assim a rodada aberta nunca é sobrescrita por um snapshot
      # histórico vazio/incompleto.

      - name: Coletar Histórico Completo
        run: python scripts/coletar_historico_completo.py

      - name: Testar API Histórica
        run: python scripts/testar_api_historica.py

      - name: Importar Histórico
        run: python scripts/importar_historico.py

      - name: Consolidar Base
        run: python scripts/processamento/consolidar_base.py

      # =====================================
      # RODADA ATUAL POR ÚLTIMO
      # =====================================
      # Esta etapa é a fonte canônica do site enquanto o mercado
      # está aberto. Ela restaura preços, status, nomes, clubes,
      # contexto e jogadores da rodada corrente depois de toda
      # reconstrução histórica.

      - name: Coletar API Atual
        run: python scripts/coletar_cartola.py

      - name: Validar rodada atual para o site
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(Path("data/api/status.json").read_text(encoding="utf-8"))
          rodada = int(status["rodada_atual"])
          caminho = Path(f"data/api/rodada-{rodada:02d}/jogadores.json")
          jogadores = json.loads(caminho.read_text(encoding="utf-8"))

          print(f"Rodada atual: {rodada}")
          print(f"Jogadores disponíveis para o site: {len(jogadores)}")

          if int(status.get("status_mercado", 0)) == 1 and len(jogadores) < 100:
              raise SystemExit(
                  f"ERRO: mercado aberto, mas apenas {len(jogadores)} jogadores foram gerados. "
                  "A coleta atual não pode ser publicada como válida."
              )
          PY

      # =====================================
      # MOTOR V2 OFICIAL
      # =====================================
      # A V2 usa o RandomForest aprovado pelo walk-forward e pelo gate
      # de produção. O treinamento é sempre restrito às rodadas anteriores.

      - name: Gerar matriz científica V2
        run: python scripts/gerar_matriz_features.py

      - name: Gerar projeções V2 da rodada atual
        run: PYTHONPATH=scripts python scripts/gerar_projecoes_v2_atual.py

      - name: Validar artefato V2 para o site
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(Path("data/api/status.json").read_text(encoding="utf-8"))
          rodada = int(status["rodada_atual"])
          path = Path("data/modelagem/projecoes_v2_atual.json")
          dados = json.loads(path.read_text(encoding="utf-8"))

          assert dados.get("versao") == "V2"
          assert dados.get("modelo") == "RandomForest"
          assert int(dados.get("rodada")) == rodada
          assert dados.get("antiLeakage") is True
          assert int(dados.get("jogadoresComProjecao", 0)) >= 100
          assert isinstance(dados.get("predicoes"), dict)

          stats_alvo = dados.get("estatisticasAlvoTreino") or {}
          stats_pred = dados.get("estatisticasPredicoes") or {}
          assert float(stats_alvo.get("desvio", 0)) >= 0.5, stats_alvo
          assert float(stats_pred.get("desvio", 0)) >= 0.1, stats_pred
          assert int(stats_pred.get("valoresUnicos", 0)) >= 5, stats_pred

          valores = list(dados["predicoes"].values())
          assert valores, "Nenhuma projeção V2 foi gerada"
          assert any(abs(float(v)) > 0.001 for v in valores), "Todas as projeções V2 são zero"

          print(
              f"V2 válida para rodada {rodada}: "
              f"{dados['jogadoresComProjecao']} jogadores com projeção; "
              f"média={stats_pred.get('media')} desvio={stats_pred.get('desvio')} "
              f"min={stats_pred.get('min')} max={stats_pred.get('max')}."
          )
          PY

      # =====================================
      # SALVAR ALTERAÇÕES
      # =====================================

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git diff --cached --quiet || (
            git commit -m "Atualização automática da base e projeções V2"
            git push
          )
