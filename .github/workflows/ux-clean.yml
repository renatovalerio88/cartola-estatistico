name: Cartola Estatístico - UX Clean
on:
  workflow_dispatch:
  push:
    branches: [feat/ux-clean-detalhes]
permissions:
  contents: write
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ux-clean-detalhes
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Integrar UX clean
        run: python scripts/processamento/integrar_ux_clean.py
      - name: Validar sintaxe
        run: |
          node --check js/recomendacoes/ux-clean.js
          node --check js/recomendacoes/cards.js
          node --check js/recomendacoes/composicao-nota.js
      - name: Auditar UX clean
        run: python scripts/processamento/auditar_ux_clean.py
      - name: Persistir integração
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html data/auditoria-ux-clean.json || true
          if ! git diff --cached --quiet; then
            git commit -m 'Integra e audita UX clean'
            git pull --rebase origin feat/ux-clean-detalhes
            git push origin HEAD:feat/ux-clean-detalhes
          fi
