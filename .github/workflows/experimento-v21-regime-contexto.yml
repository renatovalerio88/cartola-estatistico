name: Experimento V2.1 Regime Contexto

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/experimento_v21_regime_contexto.py'
      - 'scripts/experimento_v21_selecao_capitao.py'
      - 'scripts/experimento_v21_contexto_explosao.py'
      - 'scripts/enriquecer_matriz_contexto_v21.py'
      - 'scripts/calcular_contexto_poisson.py'
      - 'scripts/gerar_matriz_features.py'
      - '.github/workflows/experimento-v21-regime-contexto.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regime-contexto:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scikit-learn
      - name: Sintaxe
        run: |
          python -m py_compile scripts/calcular_contexto_poisson.py
          python -m py_compile scripts/gerar_matriz_features.py
          python -m py_compile scripts/enriquecer_matriz_contexto_v21.py
          python -m py_compile scripts/experimento_v21_contexto_explosao.py
          python -m py_compile scripts/experimento_v21_selecao_capitao.py
          python -m py_compile scripts/experimento_v21_regime_contexto.py
      - name: Regerar contexto e matriz sem R24
        run: |
          python scripts/calcular_contexto_poisson.py
          python scripts/gerar_matriz_features.py
          python scripts/enriquecer_matriz_contexto_v21.py
      - name: Gerar seleção base/contexto/explosão em walk-forward
        run: python scripts/experimento_v21_selecao_capitao.py
      - name: Testar meta-regime adaptativo
        run: python scripts/experimento_v21_regime_contexto.py
      - name: Validar gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/modelagem/experimento_v21_regime_contexto.json')
          assert p.exists()
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d.get('walkForward') is True
          assert d.get('antiLeakage') is True
          assert d.get('r24Excluida') is True
          assert d.get('rodadasAvaliadas',0) >= 15
          assert d.get('decisao') in {'CANDIDATO_REGIME_APTO_PARA_PROXIMO_GATE','MANTER_V2_SEM_META_REGIME'}
          print(json.dumps({'melhor':d.get('melhorPolitica'),'ranking':d.get('ranking'),'gates':d.get('gates'),'decisao':d.get('decisao')},ensure_ascii=False,indent=2))
          PY
      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: experimento-v21-regime-contexto
          path: |
            data/modelagem/experimento_v21_regime_contexto.json
            data/modelagem/experimento_v21_regime_contexto.md
          if-no-files-found: error
