name: Experimento V2.1 Contexto e Explosao

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/experimento_v21_contexto_explosao.py'
      - 'scripts/enriquecer_matriz_contexto_v21.py'
      - 'scripts/calcular_contexto_poisson.py'
      - 'scripts/gerar_matriz_features.py'
      - '.github/workflows/experimento-v21-contexto-explosao.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experimento-v21:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scikit-learn

      - name: Sintaxe
        run: |
          python -m py_compile scripts/calcular_contexto_poisson.py
          python -m py_compile scripts/gerar_matriz_features.py
          python -m py_compile scripts/enriquecer_matriz_contexto_v21.py
          python -m py_compile scripts/experimento_v21_contexto_explosao.py

      - name: Gerar contexto Poisson walk-forward
        run: python scripts/calcular_contexto_poisson.py

      - name: Regenerar matriz base
        run: python scripts/gerar_matriz_features.py

      - name: Recompor join atleta-rodada com contexto Poisson
        run: python scripts/enriquecer_matriz_contexto_v21.py

      - name: Rodar experimento R1-R23
        run: python scripts/experimento_v21_contexto_explosao.py

      - name: Validar integridade científica
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/modelagem/experimento_v21_contexto_explosao.json')
          assert p.exists(), 'relatorio V2.1 ausente'
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d.get('walkForward') is True
          assert d.get('antiLeakage') is True
          assert d.get('r24Excluida') is True
          assert int(d.get('rodadaCorteDiagnostico', 999)) <= 23
          assert d.get('amostrasAvaliadas', 0) >= 2000
          assert d.get('rodadasAvaliadas', 0) >= 10
          assert min(d.get('coberturaPoissonPct', {}).values() or [0]) >= 50.0
          assert d.get('decisaoContexto') in {'MANTER_V2_BASE', 'APTO_PARA_PROXIMO_TESTE'}
          print(json.dumps({
              'coberturaPoissonPct': d.get('coberturaPoissonPct'),
              'resumo': d.get('resumo'),
              'explosao10': d.get('explosao10'),
              'vitoriasPorRodada': d.get('vitoriasPorRodada'),
              'gates': d.get('gates'),
              'decisaoContexto': d.get('decisaoContexto'),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: experimento-v21-contexto-explosao
          path: |
            data/modelagem/experimento_v21_contexto_explosao.json
            data/modelagem/experimento_v21_contexto_explosao.md
            data/modelagem/contexto_poisson.json
          if-no-files-found: error
