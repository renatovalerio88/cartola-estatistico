name: Cartola Estatístico - Laboratório


on:

  workflow_dispatch:


permissions:

  contents: write


jobs:

  laboratorio:

    runs-on: ubuntu-latest


    steps:


      # ======================================
      # PREPARAÇÃO
      # ======================================


      - name: Checkout

        uses: actions/checkout@v4


      - name: Configurar Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      - name: Atualizar pip

        run: |

          python -m pip install --upgrade pip


      # ======================================
      # PROCESSAMENTO DO MODELO
      # ======================================


      - name: Gerar Backtest

        run: |

          python scripts/processamento/gerar_backtest.py


      - name: Otimizar Pesos

        run: |

          python scripts/processamento/otimizar_pesos.py


      - name: Gerar Laboratório

        run: |

          python scripts/processamento/gerar_laboratorio.py


      - name: Calibrar Modelo

        run: |

          python scripts/processamento/calibrar_modelo.py


      # ======================================
      # TESTES CIENTÍFICOS
      # ======================================


      - name: Backtest Científico

        run: |

          python scripts/processamento/backtest_cientifico.py


      - name: Analisar Componentes

        run: |

          python scripts/processamento/analisar_componentes.py


      - name: Analisar Erros

        run: |

          python scripts/processamento/analisar_erros.py


      - name: Analisar Explosões

        run: |

          python scripts/processamento/criar_explosoes.py


      - name: Calcular Potencial Explosao

        run: |

          python scripts/processamento/calcular_potencial_explosao.py


      - name: Calcular Índice Diferencial

        run: |

          python scripts/processamento/calcular_indice_diferencial.py


      - name: Testar Modelo Explosao

        run: |

          python scripts/processamento/testar_explosao_modelo.py


      - name: Backtest Inteligente

        run: |

          python scripts/processamento/backtest_inteligente.py


      - name: Gerar Histórico do Modelo

        run: |

          python scripts/processamento/gerar_historico_modelo.py


      - name: Gerar Histórico Detalhado

        run: |

          python scripts/processamento/gerar_historico_detalhado.py


      # ======================================
      # BACKTEST DE ESCALAÇÕES
      # ======================================


      - name: Gerar Histórico de Escalações

        run: |

          python scripts/processamento/gerar_historico_escalacoes.py


      - name: Diagnosticar Escalações

        run: |

          python scripts/processamento/diagnosticar_escalacoes.py


      - name: Simular Times Históricos

        run: |

          python scripts/calcular_simulacao_times.py


      - name: Gerar Ranking Simulação

        run: |

          python scripts/processamento/gerar_ranking_simulacao.py


      # ======================================
      # ANÁLISE CIENTÍFICA DAS ESCALAÇÕES
      # ======================================


      - name: Analisar Simulações Históricas

        run: |

          python scripts/processamento/analisar_simulacoes_historicas.py


      # ======================================
      # COMPARAÇÃO DOS MODELOS
      # ======================================


      - name: Comparar Modelos

        run: |

          python scripts/processamento/gerar_comparacao_modelos.py


      # ======================================
      # DIAGNÓSTICO CIENTÍFICO FINAL
      # ======================================


      - name: Diagnosticar Modelo de Escalações

        run: |

          python scripts/processamento/diagnosticar_modelo_escalacoes.py


      # ======================================
      # RESUMO DO LABORATÓRIO
      # ======================================


      - name: Mostrar Resumo do Laboratório

        shell: python

        run: |

          from pathlib import Path
          import json


          def carregar(caminho):

              caminho = Path(caminho)

              if not caminho.exists():

                  return {}

              try:

                  with open(
                      caminho,
                      "r",
                      encoding="utf-8"
                  ) as arquivo:

                      return json.load(
                          arquivo
                      )

              except Exception as erro:

                  print(
                      f"Erro ao carregar {caminho}: {erro}"
                  )

                  return {}


          def linha():

              print(
                  "=" * 65
              )


          indice = carregar(
              "data/historico-escalacoes/indice.json"
          )


          simulacao = carregar(
              "data/simulacao-times.json"
          )


          ranking = carregar(
              "data/ranking-simulacao.json"
          )


          analise = carregar(
              "data/analise-simulacoes-historicas.json"
          )


          comparacao = carregar(
              "data/comparacao-modelos.json"
          )


          diagnostico = carregar(
              "data/diagnostico-modelo-escalacoes.json"
          )


          linha()

          print(
              "CARTOLA ESTATÍSTICO - RESUMO DO LABORATÓRIO"
          )

          linha()


          # ==================================
          # HISTÓRICO
          # ==================================


          print()

          print(
              "===== HISTÓRICO DE ESCALAÇÕES ====="
          )


          print(
              "Rodadas processadas:",
              indice.get(
                  "quantidadeRodadas",
                  0
              )
          )


          print(
              "Primeira rodada:",
              indice.get(
                  "primeiraRodada"
              )
          )


          print(
              "Última rodada:",
              indice.get(
                  "ultimaRodada"
              )
          )


          # ==================================
          # SIMULAÇÃO
          # ==================================


          print()

          print(
              "===== SIMULAÇÃO HISTÓRICA ====="
          )


          quantidade_simulacao = (
              simulacao.get(
                  "quantidadeRodadas"
              )
          )


          if quantidade_simulacao is None:

              quantidade_simulacao = len(
                  simulacao.get(
                      "rodadas",
                      []
                  )
              )


          print(
              "Rodadas:",
              quantidade_simulacao
          )


          # ==================================
          # RANKING
          # ==================================


          print()

          print(
              "===== RANKING DAS ESTRATÉGIAS ====="
          )


          ranking_lista = ranking.get(
              "ranking",
              []
          )


          if not ranking_lista:

              print(
                  "Nenhuma estratégia encontrada."
              )


          for item in ranking_lista:

              print(
                  f"{item.get('posicao', '-')}º "
                  f"{item.get('nome', '-')} | "
                  f"Total: {item.get('pontosTotal', 0)} | "
                  f"Média: {item.get('mediaPontos', 0)} | "
                  f"Vitórias: {item.get('vitorias', 0)} | "
                  f"Taxa vitórias: "
                  f"{item.get('taxaVitorias', 0)}% | "
                  f"Consistência: "
                  f"{item.get('consistencia', 0)}% | "
                  f"Volatilidade: "
                  f"{item.get('volatilidade', 0)}"
              )


          print()


          print(
              "Melhor estratégia:",
              ranking.get(
                  "melhorEstrategia"
              )
          )


          segura = ranking.get(
              "estrategiaMaisSegura"
          )


          explosiva = ranking.get(
              "estrategiaMaisExplosiva"
          )


          consistente = ranking.get(
              "estrategiaMaisConsistente"
          )


          if segura:

              print(
                  "Mais segura:",
                  segura.get(
                      "nome"
                  )
              )


          if explosiva:

              print(
                  "Mais explosiva:",
                  explosiva.get(
                      "nome"
                  )
              )


          if consistente:

              print(
                  "Mais consistente:",
                  consistente.get(
                      "nome"
                  )
              )


          # ==================================
          # RANKING SEM COLD START
          # ==================================


          print()

          print(
              "===== RANKING SEM COLD START ====="
          )


          ranking_sem_cold = ranking.get(
              "rankingSemColdStart",
              []
          )


          if not ranking_sem_cold:

              print(
                  "Nenhum resultado disponível."
              )


          for item in ranking_sem_cold:

              print(
                  f"{item.get('posicao', '-')}º "
                  f"{item.get('nome', '-')} | "
                  f"Rodadas: {item.get('rodadas', 0)} | "
                  f"Total: {item.get('pontosTotal', 0)} | "
                  f"Média: {item.get('mediaPontos', 0)} | "
                  f"Consistência: "
                  f"{item.get('consistencia', 0)}%"
              )


          # ==================================
          # PRECISÃO
          # ==================================


          print()

          print(
              "===== PRECISÃO DAS ESTRATÉGIAS ====="
          )


          resumo = analise.get(
              "resumoGeral",
              []
          )


          if not resumo:

              print(
                  "Análise histórica ainda sem resultados."
              )


          for item in resumo:

              capitao = item.get(
                  "capitao",
                  {}
              )


              print(
                  f"{item.get('posicao', '-')}º "
                  f"{item.get('nome', '-')} | "
                  f"Média real: "
                  f"{item.get('mediaPontos', 0)} | "
                  f"MAE jogadores: "
                  f"{item.get('maeJogadores', 0)} | "
                  f"MAE time: "
                  f"{item.get('maeTimes', 0)} | "
                  f"Capitão: "
                  f"{capitao.get('taxaAcerto', 0)}%"
              )


          # ==================================
          # SEM COLD START
          # ==================================


          print()

          print(
              "===== PRECISÃO SEM COLD START ====="
          )


          resumo_sem_cold = analise.get(
              "resumoSemColdStart",
              []
          )


          if not resumo_sem_cold:

              print(
                  "Nenhum resultado disponível."
              )


          for item in resumo_sem_cold:

              capitao = item.get(
                  "capitao",
                  {}
              )


              print(
                  f"{item.get('posicao', '-')}º "
                  f"{item.get('nome', '-')} | "
                  f"Média: "
                  f"{item.get('mediaPontos', 0)} | "
                  f"MAE jogadores: "
                  f"{item.get('maeJogadores', 0)} | "
                  f"MAE time: "
                  f"{item.get('maeTimes', 0)} | "
                  f"Capitão: "
                  f"{capitao.get('taxaAcerto', 0)}%"
              )


          # ==================================
          # POSIÇÕES
          # ==================================


          print()

          print(
              "===== PRECISÃO POR POSIÇÃO ====="
          )


          posicoes = analise.get(
              "desempenhoPorPosicao",
              {}
          )


          for posicao in [
              "GOL",
              "LAT",
              "ZAG",
              "MEI",
              "ATA",
              "TEC"
          ]:

              dados = posicoes.get(
                  posicao,
                  {}
              )


              print(
                  f"{posicao} | "
                  f"Amostras: "
                  f"{dados.get('amostras', 0)} | "
                  f"MAE: {dados.get('mae', 0)} | "
                  f"Viés: {dados.get('vies', 0)} | "
                  f"Acerto Top Real: "
                  f"{dados.get('taxaAcertoTopReal', 0)}%"
              )


          # ==================================
          # EVOLUÇÃO
          # ==================================


          print()

          print(
              "===== EVOLUÇÃO POR HISTÓRICO DISPONÍVEL ====="
          )


          evolucao = analise.get(
              "evolucaoPorQuantidadeHistorico",
              {}
          )


          for faixa in [
              "01-03",
              "04-07",
              "08-12",
              "13+"
          ]:

              print()

              print(
                  f"Histórico {faixa}:"
              )


              itens = evolucao.get(
                  faixa,
                  []
              )


              if not itens:

                  print(
                      "  sem dados"
                  )

                  continue


              for item in itens:

                  print(
                      f"  {item.get('nome', '-')} | "
                      f"Rodadas: "
                      f"{item.get('rodadas', 0)} | "
                      f"Média: "
                      f"{item.get('mediaPontos', 0)} | "
                      f"MAE jogadores: "
                      f"{item.get('maeJogadores', 0)} | "
                      f"MAE time: "
                      f"{item.get('maeTimes', 0)}"
                  )


          # ==================================
          # COMPARAÇÃO DOS MODELOS
          # ==================================


          print()

          print(
              "===== COMPARAÇÃO DOS MODELOS ====="
          )


          modelos = comparacao.get(
              "modelos",
              []
          )


          if isinstance(
              modelos,
              dict
          ):

              for nome, dados in modelos.items():

                  if isinstance(
                      dados,
                      dict
                  ):

                      print(
                          f"{nome} | "
                          f"MAE: "
                          f"{dados.get('mae', dados.get('erroMedio', 0))}"
                      )

                  else:

                      print(
                          f"{nome}: {dados}"
                      )


          elif isinstance(
              modelos,
              list
          ):

              for modelo in modelos:

                  if not isinstance(
                      modelo,
                      dict
                  ):

                      continue


                  print(
                      f"{modelo.get('nome', modelo.get('modelo', '-'))} | "
                      f"MAE: "
                      f"{modelo.get('mae', modelo.get('erroMedio', 0))}"
                  )


          else:

              print(
                  "Formato de comparação não reconhecido."
              )


          # ==================================
          # DIAGNÓSTICO FINAL
          # ==================================


          print()

          print(
              "===== DIAGNÓSTICO CIENTÍFICO FINAL ====="
          )


          executivo = diagnostico.get(
              "resumoExecutivo",
              {}
          )


          print(
              "Melhor estratégia:",
              executivo.get(
                  "melhorEstrategia"
              )
          )


          print(
              "Estratégia mais segura:",
              executivo.get(
                  "estrategiaMaisSegura"
              )
          )


          print(
              "Estratégia mais explosiva:",
              executivo.get(
                  "estrategiaMaisExplosiva"
              )
          )


          print(
              "Posição mais previsível:",
              executivo.get(
                  "posicaoMaisPrevisivel"
              )
          )


          print(
              "Posição menos previsível:",
              executivo.get(
                  "posicaoMenosPrevisivel"
              )
          )


          print(
              "Melhor estratégia de capitão:",
              executivo.get(
                  "melhorEstrategiaCapitao"
              )
          )


          print(
              "Prioridades altas:",
              executivo.get(
                  "prioridadesAltas",
                  0
              )
          )


          print(
              "Prioridades médias:",
              executivo.get(
                  "prioridadesMedias",
                  0
              )
          )


          print(
              "Status:",
              executivo.get(
                  "status"
              )
          )


          # ==================================
          # PONTOS FORTES
          # ==================================


          print()

          print(
              "===== PONTOS FORTES ====="
          )


          pontos_fortes = diagnostico.get(
              "pontosFortes",
              []
          )


          if not pontos_fortes:

              print(
                  "Nenhum ponto forte classificado."
              )


          for item in pontos_fortes:

              print(
                  "-",
                  item.get(
                      "descricao",
                      ""
                  )
              )


          # ==================================
          # PONTOS DE ATENÇÃO
          # ==================================


          print()

          print(
              "===== PONTOS DE ATENÇÃO ====="
          )


          pontos_atencao = diagnostico.get(
              "pontosAtencao",
              []
          )


          if not pontos_atencao:

              print(
                  "Nenhum ponto crítico detectado."
              )


          for item in pontos_atencao:

              print(
                  f"[{item.get('prioridade', '-').upper()}]",
                  item.get(
                      "descricao",
                      ""
                  )
              )


          # ==================================
          # RECOMENDAÇÕES
          # ==================================


          print()

          print(
              "===== PRÓXIMAS CALIBRAÇÕES RECOMENDADAS ====="
          )


          recomendacoes = diagnostico.get(
              "recomendacoesCalibracao",
              []
          )


          if not recomendacoes:

              print(
                  "Nenhuma recomendação gerada."
              )


          for item in recomendacoes:

              print(
                  f"{item.get('id', '-')}. "
                  f"[{item.get('prioridade', '-').upper()}] "
                  f"{item.get('area', '-')} -> "
                  f"{item.get('acao', '-')}"
              )


              print(
                  "   Motivo:",
                  item.get(
                      "motivo",
                      ""
                  )
              )


          print()

          print(
              "Alteração automática de pesos: NÃO"
          )


          print()

          linha()

          print(
              "RESUMO FINALIZADO"
          )

          linha()


      # ======================================
      # VALIDAÇÃO DOS RESULTADOS
      # ======================================


      - name: Validar Resultados do Laboratório

        shell: python

        run: |

          from pathlib import Path
          import json
          import sys


          erros = []


          arquivos_obrigatorios = [

              Path(
                  "data/historico-escalacoes/indice.json"
              ),

              Path(
                  "data/simulacao-times.json"
              ),

              Path(
                  "data/ranking-simulacao.json"
              ),

              Path(
                  "data/analise-simulacoes-historicas.json"
              ),

              Path(
                  "data/diagnostico-modelo-escalacoes.json"
              )

          ]


          # ==================================
          # EXISTÊNCIA DOS ARQUIVOS
          # ==================================


          for caminho in arquivos_obrigatorios:

              if not caminho.exists():

                  erros.append(
                      f"Arquivo ausente: {caminho}"
                  )


          # ==================================
          # LEITURA
          # ==================================


          def carregar(caminho):

              try:

                  with open(
                      caminho,
                      "r",
                      encoding="utf-8"
                  ) as arquivo:

                      return json.load(
                          arquivo
                      )

              except Exception as erro:

                  erros.append(
                      f"JSON inválido em {caminho}: {erro}"
                  )

                  return {}


          # ==================================
          # VALIDAÇÕES CIENTÍFICAS
          # ==================================


          if not erros:

              indice = carregar(
                  arquivos_obrigatorios[
                      0
                  ]
              )


              simulacao = carregar(
                  arquivos_obrigatorios[
                      1
                  ]
              )


              ranking = carregar(
                  arquivos_obrigatorios[
                      2
                  ]
              )


              analise = carregar(
                  arquivos_obrigatorios[
                      3
                  ]
              )


              diagnostico = carregar(
                  arquivos_obrigatorios[
                      4
                  ]
              )


              quantidade_historico = (
                  indice.get(
                      "quantidadeRodadas"
                  )
              )


              if quantidade_historico is None:

                  quantidade_historico = len(
                      indice.get(
                          "rodadas",
                          []
                      )
                  )


              quantidade_simulacao = (
                  simulacao.get(
                      "quantidadeRodadas"
                  )
              )


              if quantidade_simulacao is None:

                  quantidade_simulacao = len(
                      simulacao.get(
                          "rodadas",
                          []
                      )
                  )


              quantidade_ranking = len(
                  ranking.get(
                      "ranking",
                      []
                  )
              )


              quantidade_analise = (
                  analise.get(
                      "quantidadeRodadas"
                  )
              )


              if quantidade_analise is None:

                  quantidade_analise = len(
                      analise.get(
                          "rodadas",
                          []
                      )
                  )


              resumo_executivo = (
                  diagnostico.get(
                      "resumoExecutivo",
                      {}
                  )
              )


              # --------------------------------
              # Histórico
              # --------------------------------


              if quantidade_historico <= 0:

                  erros.append(
                      "Histórico de escalações vazio."
                  )


              # --------------------------------
              # Simulação
              # --------------------------------


              if quantidade_simulacao <= 0:

                  erros.append(
                      "Simulação histórica vazia."
                  )


              # --------------------------------
              # Estratégias
              # --------------------------------


              if quantidade_ranking != 3:

                  erros.append(
                      "Ranking deveria possuir exatamente "
                      "3 estratégias."
                  )


              # --------------------------------
              # Análise
              # --------------------------------


              if quantidade_analise <= 0:

                  erros.append(
                      "Análise científica histórica vazia."
                  )


              # --------------------------------
              # Diagnóstico
              # --------------------------------


              if not resumo_executivo:

                  erros.append(
                      "Diagnóstico científico sem "
                      "resumo executivo."
                  )


              if not resumo_executivo.get(
                  "melhorEstrategia"
              ):

                  erros.append(
                      "Diagnóstico não identificou "
                      "a melhor estratégia."
                  )


              # --------------------------------
              # Consistência entre arquivos
              # --------------------------------


              if (
                  quantidade_historico > 0
                  and quantidade_simulacao > 0
                  and quantidade_historico
                  != quantidade_simulacao
              ):

                  erros.append(
                      "Quantidade de rodadas do histórico "
                      "difere da simulação."
                  )


              if (
                  quantidade_simulacao > 0
                  and quantidade_analise > 0
                  and quantidade_simulacao
                  != quantidade_analise
              ):

                  erros.append(
                      "Quantidade de rodadas da simulação "
                      "difere da análise científica."
                  )


              # --------------------------------
              # Estratégias esperadas
              # --------------------------------


              nomes = {

                  str(
                      item.get(
                          "nome",
                          ""
                      )
                  ).strip().lower()

                  for item in ranking.get(
                      "ranking",
                      []
                  )

              }


              esperadas = {

                  "conservador",

                  "equilibrado",

                  "agressivo"

              }


              faltantes = (
                  esperadas -
                  nomes
              )


              if faltantes:

                  erros.append(
                      "Estratégias ausentes no ranking: "
                      +
                      ", ".join(
                          sorted(
                              faltantes
                          )
                      )
                  )


              # --------------------------------
              # Pontuações
              # --------------------------------


              for item in ranking.get(
                  "ranking",
                  []
              ):

                  nome = item.get(
                      "nome",
                      "Sem nome"
                  )


                  rodadas = item.get(
                      "rodadas",
                      0
                  )


                  if rodadas <= 0:

                      erros.append(
                          f"Estratégia {nome} sem rodadas."
                      )


                  if item.get(
                      "pontosTotal"
                  ) is None:

                      erros.append(
                          f"Estratégia {nome} sem "
                          "pontuação total."
                      )


                  if item.get(
                      "mediaPontos"
                  ) is None:

                      erros.append(
                          f"Estratégia {nome} sem "
                          "média de pontos."
                      )


          # ==================================
          # RESULTADO
          # ==================================


          if erros:

              print(
                  "============================================"
              )

              print(
                  "VALIDAÇÃO DO LABORATÓRIO FALHOU"
              )

              print(
                  "============================================"
              )


              for erro in erros:

                  print(
                      "-",
                      erro
                  )


              sys.exit(
                  1
              )


          print(
              "============================================"
          )

          print(
              "VALIDAÇÃO DO LABORATÓRIO: OK"
          )

          print(
              "============================================"
          )


      # ======================================
      # COMMIT DOS RESULTADOS
      # ======================================


      - name: Commit resultados

        run: |

          git config user.name github-actions

          git config user.email github-actions@github.com

          git add .

          git diff --cached --quiet || (

            git commit -m "Atualização laboratório estatístico"

            git push

          )
