name: Cartola Estatístico - Laboratório

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:

  laboratorio:

    runs-on: ubuntu-latest

    steps:

      # ======================================
      # PREPARAÇÃO
      # ======================================

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Atualizar pip
        run: |
          python -m pip install --upgrade pip

      - name: Instalar dependências do laboratório
        run: |
          python -m pip install pulp

      - name: Verificar otimizador global
        run: |
          python scripts/processamento/otimizador_global.py

      # ======================================
      # PROCESSAMENTO DO MODELO
      # ======================================

      - name: Gerar Backtest
        run: |
          python scripts/processamento/gerar_backtest.py

      - name: Otimizar Pesos
        run: |
          python scripts/processamento/otimizar_pesos.py

      - name: Gerar Laboratório
        run: |
          python scripts/processamento/gerar_laboratorio.py

      - name: Calibrar Modelo
        run: |
          python scripts/processamento/calibrar_modelo.py

      # ======================================
      # TESTES CIENTÍFICOS
      # ======================================

      - name: Backtest Científico
        run: |
          python scripts/processamento/backtest_cientifico.py

      - name: Analisar Componentes
        run: |
          python scripts/processamento/analisar_componentes.py

      - name: Analisar Erros
        run: |
          python scripts/processamento/analisar_erros.py

      - name: Analisar Explosões
        run: |
          python scripts/processamento/criar_explosoes.py

      - name: Calcular Potencial Explosao
        run: |
          python scripts/processamento/calcular_potencial_explosao.py

      - name: Calcular Índice Diferencial
        run: |
          python scripts/processamento/calcular_indice_diferencial.py

      - name: Testar Modelo Explosao
        run: |
          python scripts/processamento/testar_explosao_modelo.py

      - name: Backtest Inteligente
        run: |
          python scripts/processamento/backtest_inteligente.py

      - name: Gerar Histórico do Modelo
        run: |
          python scripts/processamento/gerar_historico_modelo.py

      - name: Gerar Histórico Detalhado
        run: |
          python scripts/processamento/gerar_historico_detalhado.py

      # ======================================
      # VALIDAÇÃO DA CALIBRAÇÃO
      # ======================================

      - name: Auditar Top Real
        run: |
          python scripts/processamento/auditar_top_real.py

      - name: Calibrar Modelo por Posição
        run: |
          python scripts/processamento/calibrar_modelo_por_posicao.py

      - name: Backtest A/B Calibração
        run: |
          python scripts/processamento/backtest_ab_calibracao.py

      - name: Promover Calibração Validada
        run: |
          python scripts/processamento/promover_calibracao.py

      - name: Analisar Capitão
        run: |
          python scripts/processamento/analisar_capitao.py

      # ======================================
      # ESCALAÇÕES HISTÓRICAS
      # MILP + FALLBACK GREEDY
      # ======================================

      - name: Gerar Escalações Históricas
        run: |
          python scripts/processamento/gerar_historico_escalacoes.py

      - name: Diagnosticar Escalações
        run: |
          python scripts/processamento/diagnosticar_escalacoes.py

      # ======================================
      # AUDITORIA DO MILP
      # ======================================

      - name: Auditar Otimização Global
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          pasta = Path("data/historico-escalacoes")

          indice_path = pasta / "indice.json"

          print()
          print("==============================================")
          print("CARTOLA ESTATÍSTICO")
          print("AUDITORIA DO OTIMIZADOR GLOBAL")
          print("==============================================")
          print()

          if not indice_path.exists():
              raise SystemExit(
                  "[ERRO] data/historico-escalacoes/indice.json não encontrado."
              )

          with open(
              indice_path,
              "r",
              encoding="utf-8"
          ) as arquivo:
              indice = json.load(arquivo)

          print(
              "Modelo:",
              indice.get("modelo")
          )

          print(
              "Rodadas:",
              indice.get("quantidadeRodadas")
          )

          print(
              "Escalações:",
              indice.get("totalEscalacoes")
          )

          print(
              "Escalações completas:",
              indice.get("totalEscalacoesCompletas")
          )

          print(
              "Seleções MILP:",
              indice.get("totalSelecoesMILP")
          )

          print(
              "Fallback greedy:",
              indice.get("totalFallbackGreedy")
          )

          print(
              "Estratégias aprovadas:",
              indice.get("totalEstrategiasAprovadas")
          )

          print(
              "Rodadas reprovadas:",
              indice.get("rodadasReprovadas")
          )

          print(
              "Auditoria global:",
              (
                  "APROVADA"
                  if indice.get("auditoriaGlobalAprovada")
                  else "REPROVADA"
              )
          )

          print()

          total = int(
              indice.get("totalEscalacoes")
              or 0
          )

          total_milp = int(
              indice.get("totalSelecoesMILP")
              or 0
          )

          total_fallback = int(
              indice.get("totalFallbackGreedy")
              or 0
          )

          completas = int(
              indice.get("totalEscalacoesCompletas")
              or 0
          )

          aprovadas = int(
              indice.get("totalEstrategiasAprovadas")
              or 0
          )

          if total > 0:

              taxa_milp = (
                  total_milp
                  /
                  total
                  *
                  100
              )

              taxa_completas = (
                  completas
                  /
                  total
                  *
                  100
              )

              taxa_aprovadas = (
                  aprovadas
                  /
                  total
                  *
                  100
              )

          else:

              taxa_milp = 0
              taxa_completas = 0
              taxa_aprovadas = 0

          print(
              "Taxa MILP:",
              round(taxa_milp, 2),
              "%"
          )

          print(
              "Taxa escalações completas:",
              round(taxa_completas, 2),
              "%"
          )

          print(
              "Taxa auditorias aprovadas:",
              round(taxa_aprovadas, 2),
              "%"
          )

          print()

          metodos = {}

          falhas = []

          for caminho in sorted(
              pasta.glob("rodada-*.json")
          ):

              try:

                  with open(
                      caminho,
                      "r",
                      encoding="utf-8"
                  ) as arquivo:

                      dados = json.load(
                          arquivo
                      )

              except Exception as erro:

                  falhas.append({
                      "arquivo": caminho.name,
                      "erro": str(erro)
                  })

                  continue

              rodada = dados.get(
                  "rodada"
              )

              for estrategia in dados.get(
                  "estrategias",
                  []
              ):

                  metodo = (
                      estrategia.get(
                          "metodoSelecao"
                      )
                      or
                      "desconhecido"
                  )

                  metodos[
                      metodo
                  ] = (
                      metodos.get(
                          metodo,
                          0
                      )
                      +
                      1
                  )

                  if not estrategia.get(
                      "escalacaoCompleta"
                  ):

                      falhas.append({

                          "rodada":
                              rodada,

                          "estrategia":
                              estrategia.get(
                                  "nome"
                              ),

                          "tipo":
                              "escalacao_incompleta",

                          "metodo":
                              metodo
                      })

                  auditoria = estrategia.get(
                      "auditoria",
                      {}
                  )

                  if not auditoria.get(
                      "aprovada"
                  ):

                      falhas.append({

                          "rodada":
                              rodada,

                          "estrategia":
                              estrategia.get(
                                  "nome"
                              ),

                          "tipo":
                              "auditoria_reprovada",

                          "erros":
                              auditoria.get(
                                  "erros"
                              )
                      })

          print(
              "Métodos encontrados:",
              metodos
          )

          print(
              "Falhas encontradas:",
              len(falhas)
          )

          if falhas:

              print()

              for falha in falhas[:30]:

                  print(
                      "[FALHA]",
                      falha
                  )

          print()
          print("==============================================")

          if total <= 0:

              raise SystemExit(
                  "[ERRO] Nenhuma escalação foi gerada."
              )

          if total_milp <= 0:

              raise SystemExit(
                  "[ERRO] MILP não foi utilizado em nenhuma escalação."
              )

          if total_fallback > 0:

              print(
                  "[ALERTA] Houve fallback greedy em",
                  total_fallback,
                  "escalações."
              )

          if total_milp == total:

              print(
                  "[OK] 100% das escalações utilizaram MILP."
              )

          if completas == total:

              print(
                  "[OK] 100% das escalações estão completas."
              )

          if aprovadas == total:

              print(
                  "[OK] 100% das estratégias passaram na auditoria."
              )

          print("==============================================")
          PY

      # ======================================
      # LABORATÓRIO DE PATRIMÔNIO
      # ======================================

      - name: Backtest de Patrimônio
        run: |
          python scripts/processamento/backtest_patrimonio.py

      # ======================================
      # SIMULAÇÃO HISTÓRICA DE TIMES
      # ======================================

      - name: Simular Times Históricos
        run: |
          python scripts/calcular_simulacao_times.py

      - name: Gerar Ranking Simulação
        run: |
          python scripts/processamento/gerar_ranking_simulacao.py

      - name: Auditar Simulação de Times
        run: |
          python scripts/processamento/auditar_simulacao_times.py

      - name: Analisar Estratégias de Escalação
        run: |
          python scripts/processamento/analisar_estrategias_escalacao.py

      # ======================================
      # COMPARAÇÃO DOS MODELOS
      # ======================================

      - name: Comparar Modelos
        run: |
          python scripts/processamento/gerar_comparacao_modelos.py

      # ======================================
      # ESTRATÉGIAS ADAPTATIVAS V1 x V2 x V3
      # ======================================

      - name: Testar Estratégia Adaptativa V1
        run: |
          python scripts/processamento/testar_estrategia_adaptativa.py

      - name: Auditar Estratégia Adaptativa V1
        run: |
          python scripts/processamento/auditar_estrategia_adaptativa.py

      - name: Testar Estratégia Adaptativa V2
        run: |
          python scripts/processamento/testar_estrategia_adaptativa_v2.py

      - name: Testar Estratégia Adaptativa V3
        run: |
          python scripts/processamento/testar_estrategia_adaptativa_v3.py

      # ======================================
      # COMPARAÇÃO HISTÓRICA V1 x V2
      # ======================================

      - name: Comparar Estratégias Adaptativas V1 x V2
        run: |
          python scripts/processamento/comparar_estrategias_adaptativas.py

      - name: Auditar Comparação Adaptativa V1 x V2
        run: |
          python scripts/processamento/auditar_comparacao_adaptativas.py

      - name: Decidir Estratégia Adaptativa V1 x V2
        run: |
          python scripts/processamento/decidir_estrategia_adaptativa.py

      # ======================================
      # COMPARAÇÃO CIENTÍFICA V1 x V2 x V3
      # ======================================

      - name: Comparar Estratégias Adaptativas V1 x V2 x V3
        run: |
          python scripts/processamento/comparar_estrategias_adaptativas_v3.py

      - name: Auditar Comparação Adaptativa V1 x V2 x V3
        run: |
          python scripts/processamento/auditar_comparacao_adaptativas_v3.py

      # ======================================
      # RESUMO DA VALIDAÇÃO
      # ======================================

      - name: Resumo Validação Científica
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          arquivos = [
              "data/auditoria-top-real.json",
              "data/calibracao-posicoes-candidata.json",
              "data/backtest-ab-calibracao.json",
              "data/analise-capitao.json",
              "data/simulacao-times.json",
              "data/ranking-simulacao.json",
              "data/auditoria-simulacao-times.json",
              "data/analise-estrategias-escalacao.json",
              "data/comparacao-estrategias-adaptativas.json",
              "data/auditoria-comparacao-adaptativas.json",
              "data/decisao-estrategia-adaptativa.json",
              "data/comparacao-estrategias-adaptativas-v3.json",
              "data/auditoria-comparacao-adaptativas-v3.json",
              "data/backtest-patrimonio.json",
              "data/historico-escalacoes/indice.json"
          ]

          print()
          print(
              "=============================================="
          )
          print(
              "CARTOLA ESTATÍSTICO"
          )
          print(
              "RESUMO DA VALIDAÇÃO CIENTÍFICA"
          )
          print(
              "=============================================="
          )
          print()

          for nome in arquivos:

              caminho = Path(
                  nome
              )

              nome_arquivo = (
                  caminho.name
              )

              print(
                  "----------------------------------------------"
              )
              print(
                  nome
              )
              print(
                  "----------------------------------------------"
              )

              if not caminho.exists():

                  print(
                      "ARQUIVO NÃO GERADO"
                  )
                  print()

                  continue

              try:

                  with open(
                      caminho,
                      "r",
                      encoding="utf-8"
                  ) as arquivo:

                      dados = json.load(
                          arquivo
                      )

              except Exception as erro:

                  print(
                      "ERRO AO LER:",
                      erro
                  )
                  print()

                  continue

              print(
                  "Modelo:",
                  dados.get(
                      "modelo"
                  )
              )

              # ==================================
              # HISTÓRICO DE ESCALAÇÕES / MILP
              # ==================================

              if (
                  nome
                  ==
                  "data/historico-escalacoes/indice.json"
              ):

                  print(
                      "Rodadas:",
                      dados.get(
                          "quantidadeRodadas"
                      )
                  )

                  print(
                      "Escalações:",
                      dados.get(
                          "totalEscalacoes"
                      )
                  )

                  print(
                      "Escalações completas:",
                      dados.get(
                          "totalEscalacoesCompletas"
                      )
                  )

                  print(
                      "Seleções MILP:",
                      dados.get(
                          "totalSelecoesMILP"
                      )
                  )

                  print(
                      "Fallback greedy:",
                      dados.get(
                          "totalFallbackGreedy"
                      )
                  )

                  print(
                      "Estratégias aprovadas:",
                      dados.get(
                          "totalEstrategiasAprovadas"
                      )
                  )

                  print(
                      "Rodadas reprovadas:",
                      dados.get(
                          "rodadasReprovadas"
                      )
                  )

                  print(
                      "Auditoria:",
                      (
                          "APROVADA"
                          if dados.get(
                              "auditoriaGlobalAprovada"
                          )
                          else
                          "REPROVADA"
                      )
                  )

              # ==================================
              # BACKTEST A/B CALIBRAÇÃO
              # ==================================

              elif (
                  nome_arquivo
                  ==
                  "backtest-ab-calibracao.json"
              ):

                  resumo = dados.get(
                      "resumoGlobal",
                      {}
                  )

                  decisao = dados.get(
                      "decisaoPromocao",
                      {}
                  )

                  rodadas = dados.get(
                      "rodadas",
                      {}
                  )

                  print(
                      "MAE A:",
                      resumo.get(
                          "maeA"
                      )
                  )

                  print(
                      "MAE B:",
                      resumo.get(
                          "maeB"
                      )
                  )

                  print(
                      "Melhora:",
                      resumo.get(
                          "melhoraPercentual"
                      ),
                      "%"
                  )

                  print(
                      "Viés A:",
                      resumo.get(
                          "viesA"
                      )
                  )

                  print(
                      "Viés B:",
                      resumo.get(
                          "viesB"
                      )
                  )

                  print(
                      "Vitórias A:",
                      rodadas.get(
                          "vitoriasA"
                      )
                  )

                  print(
                      "Vitórias B:",
                      rodadas.get(
                          "vitoriasB"
                      )
                  )

                  print(
                      "Empates:",
                      rodadas.get(
                          "empates"
                      )
                  )

                  print(
                      "Decisão:",
                      decisao.get(
                          "decisao"
                      )
                  )

              # ==================================
              # CAPITÃO
              # ==================================

              elif (
                  nome_arquivo
                  ==
                  "analise-capitao.json"
              ):

                  resumo = dados.get(
                      "resumo",
                      {}
                  )

                  decisao = dados.get(
                      "decisaoExperimental",
                      {}
                  )

                  print(
                      "Avaliações:",
                      resumo.get(
                          "avaliacoes"
                      )
                  )

                  print(
                      "Vitórias A:",
                      resumo.get(
                          "vitoriasA"
                      )
                  )

                  print(
                      "Vitórias B:",
                      resumo.get(
                          "vitoriasB"
                      )
                  )

                  print(
                      "Média capitão A:",
                      resumo.get(
                          "mediaPontosA"
                      )
                  )

                  print(
                      "Média capitão B:",
                      resumo.get(
                          "mediaPontosB"
                      )
                  )

                  print(
                      "Ganho médio B vs A:",
                      resumo.get(
                          "ganhoMedioBvsA"
                      )
                  )

                  print(
                      "Decisão:",
                      decisao.get(
                          "decisao"
                      )
                  )

              # ==================================
              # SIMULAÇÃO HISTÓRICA
              # ==================================

              elif (
                  nome_arquivo
                  ==
                  "simulacao-times.json"
              ):

                  auditoria = dados.get(
                      "auditoria",
                      {}
                  )

                  print(
                      "Rodadas processadas:",
                      dados.get(
                          "quantidadeRodadas"
                      )
                  )

                  print(
                      "Cobertura média:",
                      auditoria.get(
                          "coberturaMediaPercentual"
                      ),
                      "%"
                  )

                  print(
                      "Auditoria:",
                      (
                          "APROVADA"
                          if auditoria.get(
                              "aprovada"
                          )
                          else
                          "REPROVADA"
                      )
                  )

              # ==================================
              # RANKING DE SIMULAÇÃO
              # ==================================

              elif (
                  nome_arquivo
                  ==
                  "ranking-simulacao.json"
              ):

                  auditoria = dados.get(
                      "auditoria",
                      {}
                  )

                  print(
                      "Rodadas:",
                      dados.get(
                          "quantidadeRodadas"
                      )
                  )

                  print(
                      "Melhor estratégia:",
                      dados.get(
                          "melhorEstrategia"
                      )
                  )

                  print(
                      "Estratégias:",
                      auditoria.get(
                          "estrategiasEncontradas"
                      )
                  )

                  print(
                      "Cobertura:",
                      auditoria.get(
                          "coberturaMediaPercentual"
                      ),
                      "%"
                  )

                  print(
                      "Auditoria:",
                      (
                          "APROVADA"
                          if auditoria.get(
                              "aprovada"
                          )
                          else
                          "REPROVADA"
                      )
                  )

                  print()
                  print(
                      "Ranking:"
                  )

                  for item in dados.get(
                      "ranking",
                      []
                  ):

                      print(
                          "#",
                          item.get(
                              "posicao"
                          ),
                          item.get(
                              "nome"
                          ),
                          "| Média:",
                          item.get(
                              "mediaPontos"
                          ),
                          "| Mediana:",
                          item.get(
                              "medianaPontos"
                          ),
                          "| Total:",
                          item.get(
                              "pontosTotal"
                          ),
                          "| Vitórias:",
                          item.get(
                              "vitorias"
                          ),
                          "| Consistência:",
                          item.get(
                              "consistencia"
                          ),
                          "| MAE:",
                          item.get(
                              "maeMedioJogadores"
                          ),
                          "| Score:",
                          item.get(
                              "scoreGlobal"
                          )
                      )

              # ==================================
              # AUDITORIA DA SIMULAÇÃO
              # ==================================

              elif (
                  nome_arquivo
                  ==
                  "auditoria-simulacao-times.json"
              ):

                  resumo = dados.get(
                      "resumo",
                      {}
                  )

                  decisao = dados.get(
                      "decisao",
                      {}
                  )

                  print(
                      "Rodadas:",
                      resumo.get(
                          "rodadas"
                      )
                  )

                  print(
                      "Times avaliados:",
                      resumo.get(
                          "timesAvaliados"
                      )
                  )

                  print(
                      "Cobertura:",
                      resumo.get(
                          "coberturaMediaPercentual"
                      ),
                      "%"
                  )

                  print(
                      "Times completos:",
                      resumo.get(
                          "taxaTimesCompletosPercentual"
                      ),
                      "%"
                  )

                  print(
                      "Capitães válidos:",
                      resumo.get(
                          "taxaCapitaesValidosPercentual"
                      ),
                      "%"
                  )

                  print(
                      "Sem vazamento:",
                      resumo.get(
                          "taxaSemVazamentoPercentual"
                      ),
                      "%"
                  )

                  print(
                      "Score qualidade:",
                      resumo.get(
                          "scoreQualidade"
                      ),
                      "%"
                  )

                  print(
                      "Testes:",
                      resumo.get(
                          "testes"
                      )
                  )

                  print(
                      "Falhas críticas:",
                      resumo.get(
                          "falhasCriticas"
                      )
                  )

                  print(
                      "Alertas:",
                      resumo.get(
                          "alertas"
                      )
                  )

                  print(
                      "Decisão:",
                      decisao.get(
                          "decisao"
                      )
                  )

                  print(
                      "Pode usar ranking:",
                      decisao.get(
                          "podeUsarRankingParaEvoluirModelo"
                      )
                  )

              # ==================================
              # ANÁLISE DAS ESTRATÉGIAS
              # ==================================

              elif (
                  nome_arquivo
                  ==
                  "analise-estrategias-escalacao.json"
              ):

                  resumo = dados.get(
                      "resumo",
                      {}
                  )

                  comparacao = (
                      dados.get(
                          "comparacaoPrimeiroSegundo",
                          {}
                      )
                      or
                      {}
                  )

                  criterios = dados.get(
                      "criteriosPromocao",
                      {}
                  )

                  decisao = dados.get(
                      "decisao",
                      {}
                  )

                  print(
                      "Rodadas:",
                      resumo.get(
                          "rodadas"
                      )
                  )

                  print(
                      "Líder:",
                      resumo.get(
                          "lider"
                      )
                  )

                  print(
                      "Média líder:",
                      resumo.get(
                          "mediaLider"
                      )
                  )

                  print(
                      "Score global líder:",
                      resumo.get(
                          "scoreGlobalLider"
                      )
                  )

                  print(
                      "Taxa de vitórias:",
                      resumo.get(
                          "taxaVitoriasLider"
                      ),
                      "%"
                  )

                  print(
                      "Estabilidade:",
                      resumo.get(
                          "estabilidadeLider"
                      ),
                      "%"
                  )

                  print(
