name: Cartola Estatístico - Laboratório

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  laboratorio:
    runs-on: ubuntu-latest

    steps:

      # ======================================
      # PREPARAÇÃO
      # ======================================

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Atualizar pip
        run: |
          python -m pip install --upgrade pip

      # ======================================
      # PROCESSAMENTO DO MODELO
      # ======================================

      - name: Gerar Backtest
        run: |
          python scripts/processamento/gerar_backtest.py

      - name: Otimizar Pesos
        run: |
          python scripts/processamento/otimizar_pesos.py

      - name: Gerar Laboratório
        run: |
          python scripts/processamento/gerar_laboratorio.py

      - name: Calibrar Modelo
        run: |
          python scripts/processamento/calibrar_modelo.py

      # ======================================
      # TESTES CIENTÍFICOS
      # ======================================

      - name: Backtest Científico
        run: |
          python scripts/processamento/backtest_cientifico.py

      - name: Analisar Componentes
        run: |
          python scripts/processamento/analisar_componentes.py

      - name: Analisar Erros
        run: |
          python scripts/processamento/analisar_erros.py

      - name: Analisar Explosões
        run: |
          python scripts/processamento/criar_explosoes.py

      - name: Calcular Potencial Explosao
        run: |
          python scripts/processamento/calcular_potencial_explosao.py

      - name: Calcular Índice Diferencial
        run: |
          python scripts/processamento/calcular_indice_diferencial.py

      - name: Testar Modelo Explosao
        run: |
          python scripts/processamento/testar_explosao_modelo.py

      - name: Backtest Inteligente
        run: |
          python scripts/processamento/backtest_inteligente.py

      - name: Gerar Histórico do Modelo
        run: |
          python scripts/processamento/gerar_historico_modelo.py

      - name: Gerar Histórico Detalhado
        run: |
          python scripts/processamento/gerar_historico_detalhado.py

      # ======================================
      # VALIDAÇÃO DA CALIBRAÇÃO
      # ======================================

      - name: Auditar Top Real
        run: |
          python scripts/processamento/auditar_top_real.py

      - name: Gerar Calibração Candidata
        run: |
          python scripts/processamento/gerar_calibracao_posicoes.py

      - name: Backtest A/B Calibração
        run: |
          python scripts/processamento/backtest_ab_calibracao.py

      - name: Analisar Capitão
        run: |
          python scripts/processamento/analisar_capitao.py

      # ======================================
      # ESCALAÇÕES HISTÓRICAS
      # ======================================

      - name: Gerar Escalações Históricas
        run: |
          python scripts/processamento/gerar_historico_escalacoes.py

      - name: Diagnosticar Escalações
        run: |
          python scripts/processamento/diagnosticar_escalacoes.py

      # ======================================
      # SIMULAÇÃO HISTÓRICA DE TIMES
      # ======================================

      - name: Simular Times Históricos
        run: |
          python scripts/calcular_simulacao_times.py

      - name: Gerar Ranking Simulação
        run: |
          python scripts/processamento/gerar_ranking_simulacao.py

      - name: Auditar Simulação de Times
        run: |
          python scripts/processamento/auditar_simulacao_times.py

      - name: Analisar Estratégias de Escalação
        run: |
          python scripts/processamento/analisar_estrategias_escalacao.py

      # ======================================
      # COMPARAÇÃO DOS MODELOS
      # ======================================

      - name: Comparar Modelos
        run: |
          python scripts/processamento/gerar_comparacao_modelos.py

      # ======================================
      # RESUMO DA VALIDAÇÃO
      # ======================================

      - name: Resumo Validação Científica
        run: |
          python - <<'PY'

          import json
          from pathlib import Path


          arquivos = [
              "data/auditoria-top-real.json",
              "data/calibracao-posicoes-candidata.json",
              "data/backtest-ab-calibracao.json",
              "data/analise-capitao.json",
              "data/simulacao-times.json",
              "data/ranking-simulacao.json",
              "data/auditoria-simulacao-times.json",
              "data/analise-estrategias-escalacao.json"
          ]


          print()
          print("==============================================")
          print("CARTOLA ESTATÍSTICO")
          print("RESUMO DA VALIDAÇÃO CIENTÍFICA")
          print("==============================================")
          print()


          for nome in arquivos:

              caminho = Path(nome)

              print("----------------------------------------------")
              print(nome)
              print("----------------------------------------------")


              if not caminho.exists():

                  print("ARQUIVO NÃO GERADO")
                  print()

                  continue


              try:

                  with open(
                      caminho,
                      "r",
                      encoding="utf-8"
                  ) as arquivo:

                      dados = json.load(
                          arquivo
                      )

              except Exception as erro:

                  print(
                      "ERRO AO LER:",
                      erro
                  )

                  print()

                  continue


              print(
                  "Modelo:",
                  dados.get(
                      "modelo"
                  )
              )


              # ==================================
              # BACKTEST A/B
              # ==================================

              if nome.endswith(
                  "backtest-ab-calibracao.json"
              ):

                  resumo = dados.get(
                      "resumoGlobal",
                      {}
                  )

                  decisao = dados.get(
                      "decisaoPromocao",
                      {}
                  )

                  rodadas = dados.get(
                      "rodadas",
                      {}
                  )

                  print(
                      "MAE A:",
                      resumo.get(
                          "maeA"
                      )
                  )

                  print(
                      "MAE B:",
                      resumo.get(
                          "maeB"
                      )
                  )

                  print(
                      "Melhora:",
                      resumo.get(
                          "melhoraPercentual"
                      ),
                      "%"
                  )

                  print(
                      "Viés A:",
                      resumo.get(
                          "viesA"
                      )
                  )

                  print(
                      "Viés B:",
                      resumo.get(
                          "viesB"
                      )
                  )

                  print(
                      "Vitórias A:",
                      rodadas.get(
                          "vitoriasA"
                      )
                  )

                  print(
                      "Vitórias B:",
                      rodadas.get(
                          "vitoriasB"
                      )
                  )

                  print(
                      "Empates:",
                      rodadas.get(
                          "empates"
                      )
                  )

                  print(
                      "Decisão:",
                      decisao.get(
                          "decisao"
                      )
                  )


              # ==================================
              # CAPITÃO
              # ==================================

              elif nome.endswith(
                  "analise-capitao.json"
              ):

                  resumo = dados.get(
                      "resumo",
                      {}
                  )

                  decisao = dados.get(
                      "decisaoExperimental",
                      {}
                  )

                  print(
                      "Avaliações:",
                      resumo.get(
                          "avaliacoes"
                      )
                  )

                  print(
                      "Vitórias A:",
                      resumo.get(
                          "vitoriasA"
                      )
                  )

                  print(
                      "Vitórias B:",
                      resumo.get(
                          "vitoriasB"
                      )
                  )

                  print(
                      "Média capitão A:",
                      resumo.get(
                          "mediaPontosA"
                      )
                  )

                  print(
                      "Média capitão B:",
                      resumo.get(
                          "mediaPontosB"
                      )
                  )

                  print(
                      "Ganho médio B vs A:",
                      resumo.get(
                          "ganhoMedioBvsA"
                      )
                  )

                  print(
                      "Decisão:",
                      decisao.get(
                          "decisao"
                      )
                  )


              # ==================================
              # SIMULAÇÃO
              # ==================================

              elif nome.endswith(
                  "simulacao-times.json"
              ):

                  auditoria = dados.get(
                      "auditoria",
                      {}
                  )

                  print(
                      "Rodadas processadas:",
                      dados.get(
                          "quantidadeRodadas"
                      )
                  )

                  print(
                      "Cobertura média:",
                      auditoria.get(
                          "coberturaMediaPercentual"
                      ),
                      "%"
                  )

                  print(
                      "Auditoria:",
                      (
                          "APROVADA"
                          if auditoria.get(
                              "aprovada"
                          )
                          else
                          "REPROVADA"
                      )
                  )


              # ==================================
              # RANKING
              # ==================================

              elif nome.endswith(
                  "ranking-simulacao.json"
              ):

                  auditoria = dados.get(
                      "auditoria",
                      {}
                  )

                  print(
                      "Rodadas:",
                      dados.get(
                          "quantidadeRodadas"
                      )
                  )

                  print(
                      "Melhor estratégia:",
                      dados.get(
                          "melhorEstrategia"
                      )
                  )

                  print(
                      "Estratégias:",
                      auditoria.get(
                          "estrategiasEncontradas"
                      )
                  )

                  print(
                      "Cobertura:",
                      auditoria.get(
                          "coberturaMediaPercentual"
                      ),
                      "%"
                  )

                  print(
                      "Auditoria:",
                      (
                          "APROVADA"
                          if auditoria.get(
                              "aprovada"
                          )
                          else
                          "REPROVADA"
                      )
                  )

                  for item in dados.get(
                      "ranking",
                      []
                  ):

                      print(
                          "#",
                          item.get(
                              "posicao"
                          ),
                          item.get(
                              "nome"
                          ),
                          "| Média:",
                          item.get(
                              "mediaPontos"
                          ),
                          "| Total:",
                          item.get(
                              "pontosTotal"
                          ),
                          "| Vitórias:",
                          item.get(
                              "vitorias"
                          ),
                          "| Score:",
                          item.get(
                              "scoreGlobal"
                          )
                      )


              # ==================================
              # AUDITORIA SIMULAÇÃO
              # ==================================

              elif nome.endswith(
                  "auditoria-simulacao-times.json"
              ):

                  resumo = dados.get(
                      "resumo",
                      {}
                  )

                  decisao = dados.get(
                      "decisao",
                      {}
                  )

                  print(
                      "Rodadas:",
                      resumo.get(
                          "rodadas"
                      )
                  )

                  print(
                      "Times avaliados:",
                      resumo.get(
                          "timesAvaliados"
                      )
                  )

                  print(
                      "Cobertura:",
                      resumo.get(
                          "coberturaMediaPercentual"
                      ),
                      "%"
                  )

                  print(
                      "Times completos:",
                      resumo.get(
                          "taxaTimesCompletosPercentual"
                      ),
                      "%"
                  )

                  print(
                      "Sem vazamento:",
                      resumo.get(
                          "taxaSemVazamentoPercentual"
                      ),
                      "%"
                  )

                  print(
                      "Score qualidade:",
                      resumo.get(
                          "scoreQualidade"
                      ),
                      "%"
                  )

                  print(
                      "Falhas críticas:",
                      resumo.get(
                          "falhasCriticas"
                      )
                  )

                  print(
                      "Decisão:",
                      decisao.get(
                          "decisao"
                      )
                  )


              # ==================================
              # ANÁLISE DAS ESTRATÉGIAS
              # ==================================

              elif nome.endswith(
                  "analise-estrategias-escalacao.json"
              ):

                  resumo = dados.get(
                      "resumo",
                      {}
                  )

                  comparacao = dados.get(
                      "comparacaoPrimeiroSegundo",
                      {}
                  ) or {}

                  criterios = dados.get(
                      "criteriosPromocao",
                      {}
                  )

                  decisao = dados.get(
                      "decisao",
                      {}
                  )

                  print(
                      "Rodadas:",
                      resumo.get(
                          "rodadas"
                      )
                  )

                  print(
                      "Líder:",
                      resumo.get(
                          "lider"
                      )
                  )

                  print(
                      "Média líder:",
                      resumo.get(
                          "mediaLider"
                      )
                  )

                  print(
                      "Taxa de vitórias:",
                      resumo.get(
                          "taxaVitoriasLider"
                      ),
                      "%"
                  )

                  print(
                      "Estabilidade:",
                      resumo.get(
                          "estabilidadeLider"
                      ),
                      "%"
                  )

                  print(
                      "Cobertura:",
                      resumo.get(
                          "coberturaLider"
                      ),
                      "%"
                  )

                  print(
                      "Score confiança:",
                      resumo.get(
                          "scoreConfianca"
                      ),
                      "%"
                  )

                  print(
                      "Segundo colocado:",
                      comparacao.get(
                          "segundo"
                      )
                  )

                  print(
                      "Vantagem média:",
                      comparacao.get(
                          "vantagemMedia"
                      )
                  )

                  print(
                      "Vantagem percentual:",
                      comparacao.get(
                          "vantagemMediaPercentual"
                      ),
                      "%"
                  )

                  print(
                      "Critérios aprovados:",
                      criterios.get(
                          "aprovados"
                      )
                  )

                  print(
                      "Critérios pendentes:",
                      criterios.get(
                          "falhas"
                      )
                  )

                  print(
                      "Decisão:",
                      decisao.get(
                          "decisao"
                      )
                  )

                  print(
                      "Estratégia recomendada:",
                      decisao.get(
                          "estrategiaRecomendada"
                      )
                  )

                  print(
                      "Promoção automática:",
                      decisao.get(
                          "promocaoAutomatica"
                      )
                  )


              else:

                  print(
                      "Arquivo gerado com sucesso."
                  )


              print()


          print("==============================================")
          print("FIM DA VALIDAÇÃO")
          print("==============================================")

          PY

      # ======================================
      # COMMIT DOS RESULTADOS
      # ======================================

      - name: Commit resultados
        run: |

          git config user.name github-actions

          git config user.email github-actions@github.com

          git add .

          git diff --cached --quiet || (

            git commit -m "Atualização laboratório estatístico"

            git push

          )
