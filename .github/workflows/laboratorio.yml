name: Cartola Estatístico - Laboratório


on:

  workflow_dispatch:


permissions:

  contents: write



jobs:

  laboratorio:

    runs-on: ubuntu-latest


    steps:


      - name: Checkout

        uses: actions/checkout@v4



      - name: Configurar Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"



      - name: Atualizar pip

        run: |

          python -m pip install --upgrade pip



      # ======================================
      # PROCESSAMENTO DO MODELO
      # ======================================


      - name: Gerar Backtest

        run: |

          python scripts/processamento/gerar_backtest.py



      - name: Otimizar Pesos

        run: |

          python scripts/processamento/otimizar_pesos.py



      - name: Gerar Laboratório

        run: |

          python scripts/processamento/gerar_laboratorio.py



      - name: Calibrar Modelo

        run: |

          python scripts/processamento/calibrar_modelo.py



      # ======================================
      # TESTES CIENTÍFICOS
      # ======================================


      - name: Backtest Científico

        run: |

          python scripts/processamento/backtest_cientifico.py



      - name: Analisar Componentes

        run: |

          python scripts/processamento/analisar_componentes.py



      - name: Analisar Erros

        run: |

          python scripts/processamento/analisar_erros.py



      - name: Analisar Explosões

        run: |

          python scripts/processamento/criar_explosoes.py



      - name: Calcular Potencial Explosao

        run: |

          python scripts/processamento/calcular_potencial_explosao.py



      - name: Calcular Índice Diferencial

        run: |

          python scripts/processamento/calcular_indice_diferencial.py



      - name: Testar Modelo Explosao

        run: |

          python scripts/processamento/testar_explosao_modelo.py



      - name: Backtest Inteligente

        run: |

          python scripts/processamento/backtest_inteligente.py



      - name: Gerar Histórico do Modelo

        run: |

          python scripts/processamento/gerar_historico_modelo.py



      - name: Gerar Histórico Detalhado

        run: |

          python scripts/processamento/gerar_historico_detalhado.py



      # ======================================
      # SIMULAÇÃO DE CAMPEONATO
      # ======================================


      - name: Diagnosticar Escalações

        run: |

          python scripts/processamento/diagnosticar_escalacoes.py



      - name: Simular Times Históricos

        run: |

          python scripts/calcular_simulacao_times.py



      - name: Gerar Ranking Simulação

        run: |

          python scripts/processamento/gerar_ranking_simulacao.py



      - name: Comparar Modelos

        run: |

          python scripts/processamento/gerar_comparacao_modelos.py



      # ======================================
      # VALIDAÇÃO CIENTÍFICA AVANÇADA
      # ======================================


      - name: Auditar Top Real

        run: |

          python scripts/processamento/auditar_top_real.py



      - name: Calibrar Modelo por Posição

        run: |

          python scripts/processamento/calibrar_modelo_por_posicao.py



      - name: Backtest AB da Calibração

        run: |

          python scripts/processamento/backtest_ab_calibracao.py



      - name: Analisar Capitão

        run: |

          python scripts/processamento/analisar_capitao.py



      # ======================================
      # DIAGNÓSTICO DOS NOVOS RESULTADOS
      # ======================================


      - name: Resumo Validação Científica

        run: |

          python - <<'PY'

          import json
          from pathlib import Path


          arquivos = [

              "data/auditoria-top-real.json",

              "data/calibracao-posicoes-candidata.json",

              "data/backtest-ab-calibracao.json",

              "data/analise-capitao.json"

          ]


          print()
          print("==============================================")
          print("CARTOLA ESTATÍSTICO")
          print("RESUMO DA VALIDAÇÃO CIENTÍFICA")
          print("==============================================")
          print()


          for nome in arquivos:

              caminho = Path(nome)


              print("----------------------------------------------")
              print(nome)
              print("----------------------------------------------")


              if not caminho.exists():

                  print("ARQUIVO NÃO GERADO")
                  print()

                  continue


              try:

                  with open(
                      caminho,
                      "r",
                      encoding="utf-8"
                  ) as arquivo:

                      dados = json.load(
                          arquivo
                      )


              except Exception as erro:

                  print(
                      "ERRO AO LER:",
                      erro
                  )

                  print()

                  continue


              print(
                  "Modelo:",
                  dados.get(
                      "modelo"
                  )
              )


              if nome.endswith(
                  "backtest-ab-calibracao.json"
              ):

                  resumo = dados.get(
                      "resumoGlobal",
                      {}
                  )


                  decisao = dados.get(
                      "decisaoPromocao",
                      {}
                  )


                  rodadas = dados.get(
                      "rodadas",
                      {}
                  )


                  print(
                      "MAE A:",
                      resumo.get(
                          "maeA"
                      )
                  )


                  print(
                      "MAE B:",
                      resumo.get(
                          "maeB"
                      )
                  )


                  print(
                      "Melhora:",
                      resumo.get(
                          "melhoraPercentual"
                      ),
                      "%"
                  )


                  print(
                      "Viés A:",
                      resumo.get(
                          "viesA"
                      )
                  )


                  print(
                      "Viés B:",
                      resumo.get(
                          "viesB"
                      )
                  )


                  print(
                      "Vitórias A:",
                      rodadas.get(
                          "vitoriasA"
                      )
                  )


                  print(
                      "Vitórias B:",
                      rodadas.get(
                          "vitoriasB"
                      )
                  )


                  print(
                      "Empates:",
                      rodadas.get(
                          "empates"
                      )
                  )


                  print(
                      "Decisão:",
                      decisao.get(
                          "decisao"
                      )
                  )


              elif nome.endswith(
                  "analise-capitao.json"
              ):

                  resumo = dados.get(
                      "resumo",
                      {}
                  )


                  decisao = dados.get(
                      "decisaoExperimental",
                      {}
                  )


                  print(
                      "Avaliações:",
                      resumo.get(
                          "avaliacoes"
                      )
                  )


                  print(
                      "Vitórias A:",
                      resumo.get(
                          "vitoriasA"
                      )
                  )


                  print(
                      "Vitórias B:",
                      resumo.get(
                          "vitoriasB"
                      )
                  )


                  print(
                      "Média capitão A:",
                      resumo.get(
                          "mediaPontosA"
                      )
                  )


                  print(
                      "Média capitão B:",
                      resumo.get(
                          "mediaPontosB"
                      )
                  )


                  print(
                      "Ganho médio B vs A:",
                      resumo.get(
                          "ganhoMedioBvsA"
                      )
                  )


                  print(
                      "Decisão:",
                      decisao.get(
                          "decisao"
                      )
                  )


              else:

                  print(
                      "Arquivo gerado com sucesso."
                  )


              print()


          print("==============================================")
          print("FIM DA VALIDAÇÃO")
          print("==============================================")

          PY



      # ======================================
      # COMMIT DOS RESULTADOS
      # ======================================


      - name: Commit resultados

        run: |


          git config user.name github-actions


          git config user.email github-actions@github.com


          git add .


          git diff --cached --quiet || (


            git commit -m "Atualização laboratório estatístico"


            git push


          )
