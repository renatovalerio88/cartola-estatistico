name: Experimento V2.1 Selecao e Capitao

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/experimento_v21_selecao_capitao.py'
      - 'scripts/experimento_v21_contexto_explosao.py'
      - 'scripts/enriquecer_matriz_contexto_v21.py'
      - 'scripts/calcular_contexto_poisson.py'
      - 'scripts/gerar_matriz_features.py'
      - '.github/workflows/experimento-v21-selecao-capitao.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selecao-capitao:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scikit-learn

      - name: Sintaxe
        run: |
          python -m py_compile scripts/calcular_contexto_poisson.py
          python -m py_compile scripts/gerar_matriz_features.py
          python -m py_compile scripts/enriquecer_matriz_contexto_v21.py
          python -m py_compile scripts/experimento_v21_contexto_explosao.py
          python -m py_compile scripts/experimento_v21_selecao_capitao.py

      - name: Contexto Poisson walk-forward
        run: python scripts/calcular_contexto_poisson.py

      - name: Matriz científica
        run: python scripts/gerar_matriz_features.py

      - name: Enriquecer join de contexto
        run: python scripts/enriquecer_matriz_contexto_v21.py

      - name: Testar seleção e capitão R1-R23
        run: python scripts/experimento_v21_selecao_capitao.py

      - name: Validar saída
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/modelagem/experimento_v21_selecao_capitao.json')
          assert p.exists()
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d.get('walkForward') is True
          assert d.get('antiLeakage') is True
          assert d.get('r24Excluida') is True
          assert d.get('rodadasAvaliadas', 0) >= 10
          assert d.get('decisao') in {'APTO_PARA_GATE_OPERACIONAL', 'MANTER_SELECAO_V2_ATUAL'}
          print(json.dumps({
              'resumo': d.get('resumo'),
              'formacoes': d.get('formacoes'),
              'gates': d.get('gates'),
              'decisao': d.get('decisao'),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: experimento-v21-selecao-capitao
          path: |
            data/modelagem/experimento_v21_selecao_capitao.json
            data/modelagem/experimento_v21_selecao_capitao.md
          if-no-files-found: error
