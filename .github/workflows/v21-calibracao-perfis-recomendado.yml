name: V2.1 - Calibracao de perfis e Recomendado

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/experimentos/calibrar_perfis_recomendado_v21.py"
      - "scripts/processamento/reprocessar_pontuacao_final_cartola.py"
      - "scripts/processamento/calibrar_historico_publico_v21.py"
      - ".github/workflows/v21-calibracao-perfis-recomendado.yml"
      - ".github/workflows/coletar-cartola.yml"

jobs:
  calibrar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validar sintaxe
        run: |
          python -m py_compile scripts/processamento/reprocessar_pontuacao_final_cartola.py
          python -m py_compile scripts/processamento/calibrar_historico_publico_v21.py
          python -m py_compile scripts/experimentos/calibrar_perfis_recomendado_v21.py

      - name: Reconstruir pontuacao final oficial
        run: python scripts/processamento/reprocessar_pontuacao_final_cartola.py

      - name: Exigir gate da pontuacao final
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/pontuacao-final-cartola-v21.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['gate']['aptaParaRankingFinal'] is True, d['gate']
          assert d['resumo']['entradasInferidas'] == 0, d['resumo']
          assert d['resumo']['timesProcessados'] >= 60, d['resumo']
          print('Pontuacao final apta:', d['resumo'])
          PY

      - name: Rodar calibracao walk-forward e Recomendado
        run: python scripts/experimentos/calibrar_perfis_recomendado_v21.py

      - name: Validar anti-leakage e saida do laboratorio
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data/laboratorio/calibracao-perfis-v21.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['antiLeakage'] is True
          assert d['rodadaMaximaFonte'] >= 23
          assert set(d['calibracao']['resumo']) == {'Conservador','Equilibrado','Agressivo'}
          for perfil, x in d['calibracao']['resumo'].items():
              assert x['rodadasAvaliadas'] >= 15, (perfil, x)
              assert 0.45 <= x['fatorAtual'] <= 1.10, (perfil, x)
          assert d['politicaVencedora'] in {'cumulativo','janela3','janela5','janela8','ewma','consistencia5'}
          print(json.dumps({
              'calibracao': d['calibracao']['resumo'],
              'politicaVencedora': d['politicaVencedora'],
              'gatePoliticaVencedora': d['gatePoliticaVencedora'],
              'promocao': d['promocao'],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Aplicar apenas calibracoes aprovadas ao Historico publico
        run: python scripts/processamento/calibrar_historico_publico_v21.py

      - name: Validar contrato do Historico calibrado
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          lab = json.loads(Path('data/laboratorio/calibracao-perfis-v21.json').read_text(encoding='utf-8'))
          hist = json.loads(Path('data/pontuacao-final-cartola-v21.json').read_text(encoding='utf-8'))
          c = hist['calibracaoHistorico']

          assert c['antiLeakage'] is True
          assert c['timeRecomendadoPromovido'] is False
          aprovados_lab = {p for p, x in lab['calibracao']['resumo'].items() if x['gateCalibracao']}
          assert set(c['perfisAprovados']) == aprovados_lab, (c['perfisAprovados'], aprovados_lab)

          for rodada in hist['rodadas']:
              for time in rodada.get('times', []):
                  perfil = time.get('perfil')
                  assert 'projecaoFinalPreJogoOriginal' in time
                  assert 'calibracaoAplicada' in time
                  if time['calibracaoAplicada']:
                      assert perfil in aprovados_lab
                      assert 0.45 <= float(time['fatorCalibracao']) <= 1.10
                  for j in time.get('jogadores', []):
                      assert 'projecaoOriginal' in j

          print(json.dumps({
              'perfisAprovados': c['perfisAprovados'],
              'perfisSemAjuste': c['perfisSemAjuste'],
              'resumoCalibrado': hist.get('resumoPorPerfilCalibrado'),
              'recomendadoPromovido': c['timeRecomendadoPromovido'],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Publicar diagnostico como artifact
        uses: actions/upload-artifact@v4
        with:
          name: calibracao-perfis-v21
          path: |
            data/laboratorio/calibracao-perfis-v21.json
            data/pontuacao-final-cartola-v21.json
