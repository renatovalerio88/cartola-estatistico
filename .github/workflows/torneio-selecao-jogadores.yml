name: Cartola Estatístico - Torneios Científicos

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/processamento/torneio_selecao_jogadores.py"
      - "scripts/processamento/torneio_capitao.py"
      - "scripts/processamento/torneio_capitao_v2.py"
      - ".github/workflows/torneio-selecao-jogadores.yml"

permissions:
  contents: write

concurrency:
  group: cartola-estatistico-torneios-cientificos
  cancel-in-progress: true

jobs:
  torneios:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validar base histórica
        run: |
          python - <<'PY'
          from pathlib import Path
          arquivos = sorted(Path("data/historico").glob("rodada-*.json"))
          if len(arquivos) < 10:
              raise SystemExit(f"Base histórica insuficiente: {len(arquivos)} rodadas")
          print(f"Base histórica válida: {len(arquivos)} rodadas")
          PY

      - name: Torneio de Seleção dos 11
        run: python scripts/processamento/torneio_selecao_jogadores.py

      - name: Torneio de Capitães V1
        run: python scripts/processamento/torneio_capitao.py

      - name: Torneio de Capitães V2
        run: python scripts/processamento/torneio_capitao_v2.py

      - name: Validar resultados
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          arquivos = [
              Path("data/torneio-selecao-jogadores.json"),
              Path("data/torneio-capitao.json"),
              Path("data/torneio-capitao-v2.json"),
          ]
          for caminho in arquivos:
              if not caminho.exists():
                  raise SystemExit(f"Resultado não gerado: {caminho}")
              dados = json.loads(caminho.read_text(encoding="utf-8"))
              ranking = dados.get("ranking") or []
              if not ranking:
                  raise SystemExit(f"Ranking vazio: {caminho}")
              print(f"{caminho}: {len(ranking)} candidatos")
              melhor = dados.get("melhorExperimental") or dados.get("melhorPerfil") or {}
              print("  melhor:", melhor.get("modelo") or melhor.get("perfil"))
              print("  ganho:", melhor.get("ganhoMedioVsAtual") or melhor.get("ganhoMedioTimeVsAtual"))
          PY

      - name: Commit resultados
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -- data/torneio-selecao-jogadores.json data/torneio-capitao.json data/torneio-capitao-v2.json
          git diff --cached --quiet || (
            git commit -m "Atualiza torneios científicos de seleção e capitão"
            git push
          )
