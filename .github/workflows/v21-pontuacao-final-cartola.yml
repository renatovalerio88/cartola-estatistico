name: V2.1 Pontuacao Final Cartola

on:
  pull_request:
    paths:
      - 'scripts/processamento/reprocessar_pontuacao_final_cartola.py'
      - 'data/historico-escalacoes/**'
      - 'data/historico/**'
      - 'data/api/**'
      - '.github/workflows/v21-pontuacao-final-cartola.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reprocessar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reprocessar rodadas oficialmente encerradas
        run: python scripts/processamento/reprocessar_pontuacao_final_cartola.py
      - name: Validar saída e anti-leakage da rodada-alvo
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('data/pontuacao-final-cartola-v21.json')
          assert p.exists(), 'saida ausente'
          d = json.loads(p.read_text(encoding='utf-8'))
          status = d['statusColeta']
          atual = int(status['rodadaAtual'])
          mercado = int(status['statusMercado'])
          bola = bool(status['bolaRolando'])
          processadas = [int(r['rodada']) for r in d['rodadas']]

          assert d['resumo']['timesProcessados'] > 0
          assert all(r <= int(d['rodadaMaximaCandidata']) for r in processadas)

          # Com mercado aberto ou bola rolando, a rodada atual é alvo e não
          # pode contaminar o retrospectivo. Com rodada encerrada, ela só entra
          # se o snapshot pós-rodada tiver cobertura explícita suficiente.
          if mercado == 1 or bola:
              assert atual not in processadas, (atual, processadas[-3:])
          if atual in processadas:
              fonte = d['fontesResultado'][str(atual)]
              qualidade = fonte['qualidade']
              assert qualidade[0] >= 100 and qualidade[1] >= 100, fonte

          assert int(d['rodadaMaximaProcessada']) == max(processadas)
          print(json.dumps({
              'rodadaAtual': atual,
              'statusMercado': mercado,
              'bolaRolando': bola,
              'rodadaMaximaProcessada': d['rodadaMaximaProcessada'],
              'rodadaAtualIncluida': d['rodadaAtualIncluida'],
              **d['resumo'],
              **d['gate'],
          }, ensure_ascii=False, indent=2))
          PY
      - name: Upload diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: pontuacao-final-cartola-v21
          path: data/pontuacao-final-cartola-v21.json
