name: Cartola Estatístico - Critérios por Posição
on:
  workflow_dispatch:
  push:
    branches: [feat/fechamento-cientifico-producao]
permissions:
  contents: write
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fechamento-cientifico-producao
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sintaxe do motor
        run: node --check js/motor/pesos.js
      - name: Critérios elegíveis por posição
        run: python scripts/processamento/auditar_criterios_por_posicao.py
      - name: Avaliar anti-conflito histórico
        run: python scripts/processamento/avaliar_anti_conflito.py
      - name: Persistir auditorias
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/auditoria-criterios-por-posicao.json data/avaliacao-anti-conflito.json || true
          if ! git diff --cached --quiet; then
            git commit -m 'Registra auditorias científicas do fechamento'
            git pull --rebase origin feat/fechamento-cientifico-producao
            git push origin HEAD:feat/fechamento-cientifico-producao
          fi
