name: Experimento V2.1 - Clima histórico

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/auditar_contexto_externo_v21.py'
      - 'scripts/coletar_clima_historico_v21.py'
      - '.github/workflows/experimento-v21-clima.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clima:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validar sintaxe
        run: python -m py_compile scripts/auditar_contexto_externo_v21.py scripts/coletar_clima_historico_v21.py
      - name: Revalidar cobertura de estádios
        run: python scripts/auditar_contexto_externo_v21.py
      - name: Coletar clima das rodadas fechadas
        run: python scripts/coletar_clima_historico_v21.py
      - name: Validar cobertura e gate temporal climático
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          a = json.loads(Path('data/modelagem/auditoria_contexto_externo_v21.json').read_text(encoding='utf-8'))
          c = json.loads(Path('data/modelagem/clima_historico_v21.json').read_text(encoding='utf-8'))

          assert a.get('clima', {}).get('coberturaCoordenadaPct', 0) >= 95.0
          assert a.get('clima', {}).get('decisao') == 'APTO_PARA_COLETA_OPEN_METEO'
          assert c.get('jogos', 0) >= 200
          assert c.get('coberturaPct', 0) >= 90.0
          assert c.get('aptoParaBacktestDiagnostico') is True

          assert c.get('antiLeakagePredicao') is False
          assert c.get('preJogoReproduzivel') is False
          assert c.get('bloqueiaPromocao') is True
          assert c.get('aptoParaPromocao') is False
          assert c.get('usoPermitido') == 'DIAGNOSTICO_UPPER_BOUND'

          rodadas = c.get('rodadasIncluidas') or []
          assert rodadas
          assert max(rodadas) == int(c.get('rodadaMaximaUsada'))
          diag = (c.get('diagnosticoRodadas') or {}).get('rodadas') or {}
          for rodada in rodadas:
              assert diag.get(str(rodada), {}).get('resultadoExplicito') is True

          print(json.dumps({
              'auditoriaClima': a['clima'],
              'coleta': {
                  'rodadasIncluidas': rodadas,
                  'rodadaMaximaUsada': c.get('rodadaMaximaUsada'),
                  'jogos': c.get('jogos'),
                  'coberturaPct': c.get('coberturaPct'),
                  'usoPermitido': c.get('usoPermitido'),
                  'bloqueiaPromocao': c.get('bloqueiaPromocao'),
                  'motivoBloqueio': c.get('motivoBloqueio'),
              }
          }, ensure_ascii=False, indent=2))
          PY
      - name: Publicar clima histórico diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: clima-historico-v21
          path: |
            data/contexto-externo/clima_historico_v21.json
            data/modelagem/clima_historico_v21.json
            data/modelagem/auditoria_contexto_externo_v21.json
          if-no-files-found: error
